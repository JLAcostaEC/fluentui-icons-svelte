<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<script>
			// Apply the saved (or system) theme before first paint so there is no light flash.
			// Keep the storage key in sync with THEME_KEY in src/internal/theme.svelte.ts.
			try {
				var saved = localStorage.getItem('fluentui-icons-theme');
				var dark =
					saved === 'dark' ||
					(saved !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
				document.documentElement.classList.toggle('dark', dark);
				document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
			} catch (e) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div id="app">%sveltekit.body%</div>
	</body>
</html>
